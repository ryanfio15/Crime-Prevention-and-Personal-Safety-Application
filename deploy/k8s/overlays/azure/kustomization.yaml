# Azure AKS. Before deploy.sh (docs/KUBERNETES.md, "Azure"):
# - node pools labelled safety.io/tier=app and safety.io/tier=data (taint the
#   data pool dedicated=data:NoSchedule), e.g. Standard_D8s_v5 and
#   Standard_E4s_v5;
# - Traefik: helm install traefik traefik/traefik -n traefik --create-namespace
#   -f deploy/k8s/overlays/azure/traefik-values.yaml
# AKS ships metrics-server and the managed-csi-premium StorageClass.
# FORWARDED_ALLOW_IPS: 10.244.0.0/16 is Azure CNI Overlay's default pod CIDR;
# use your cluster's --pod-cidr.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
patches:
  - target: {kind: ConfigMap, name: safety-config}
    patch: |-
      - op: replace
        path: /data/FORWARDED_ALLOW_IPS
        value: "10.244.0.0/16"
  - target: {group: postgresql.cnpg.io, kind: Cluster, name: safety-db}
    patch: |-
      - op: add
        path: /spec/storage/storageClass
        value: managed-csi-premium
  - target: {kind: PersistentVolumeClaim}
    patch: |-
      - op: add
        path: /spec/storageClassName
        value: managed-csi-premium
