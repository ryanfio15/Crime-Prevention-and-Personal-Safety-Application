# Ingress through Traefik: k3s ships it, and the cloud overlays install the
# same controller (docs/KUBERNETES.md). ingress-nginx, which mirrored the home
# server's nginx most closely, was retired upstream in March 2026.
#
# The home server's nginx limits (deploy/nginx/safety.conf) move here as
# Traefik middlewares keyed on the client address, one Ingress per zone so
# each path gets its own; Traefik matches the longest path first. The app's
# own limiter (safety/api/ratelimit.py) stays on behind them as a backstop.
# Both count per pod, so with two Traefik replicas a client can get up to
# twice these rates -- the trade-off for not running a shared limiter store.
#
# No host or TLS here: on FABRIC the site is reached through an SSH tunnel.
# A cloud overlay adds `host` and a `tls` block (cert-manager or the cloud's
# certificate service); the app sends HSTS once X-Forwarded-Proto is https.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: conn-limit
spec:
  # nginx `limit_conn safety_conn 20`: concurrent requests per client address.
  inFlightReq:
    amount: 20
    sourceCriterion:
      ipStrategy: {}
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: ratelimit-api
spec:
  rateLimit:
    average: 10
    period: 1s
    burst: 20
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: ratelimit-cells
spec:
  rateLimit:
    average: 2
    period: 1s
    burst: 10
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: ratelimit-directions
spec:
  rateLimit:
    average: 30
    period: 1m
    burst: 6
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: ratelimit-geocode
spec:
  rateLimit:
    average: 3
    period: 1s
    burst: 10
---
# The front end and /docs: not rate limited, as on nginx.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: safety-web
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: safety-conn-limit@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: safety-api
                port:
                  name: http
---
# Every other /api/v1 path: 10 r/s, burst 20 (nginx zone safety_api).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: safety-api
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: safety-conn-limit@kubernetescrd,safety-ratelimit-api@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /api/v1
            pathType: Prefix
            backend:
              service:
                name: safety-api
                port:
                  name: http
---
# The whole-city layer: 2 r/s, burst 10 (nginx zone safety_cells).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: safety-cells
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: safety-conn-limit@kubernetescrd,safety-ratelimit-cells@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /api/v1/cells
            pathType: Exact
            backend:
              service:
                name: safety-api
                port:
                  name: http
---
# Directions: 30 r/min, burst 6 (the app's own zone).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: safety-directions
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: safety-conn-limit@kubernetescrd,safety-ratelimit-directions@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /api/v1/directions
            pathType: Exact
            backend:
              service:
                name: safety-api
                port:
                  name: http
---
# Address search and reverse lookup share one zone: 3 r/s, burst 10.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: safety-geocode
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: safety-conn-limit@kubernetescrd,safety-ratelimit-geocode@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /api/v1/geocode
            pathType: Prefix
            backend:
              service:
                name: safety-api
                port:
                  name: http
