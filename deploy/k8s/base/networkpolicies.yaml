# Who may talk to what. Kubernetes always allows a node's own traffic to its
# pods, so kubelet probes are unaffected.

# The database: its own instances (replication), the CloudNativePG operator
# (cnpg-system, status and control on 8000), and pods labelled
# safety.io/db-client=true -- the API, the ETL, the jobs and the backup.
# Selected by the operator's cluster label whatever its value, so it covers
# safety-db or, with the cities split across databases, safety-db1..3.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: safety-db
spec:
  podSelector:
    matchExpressions:
      - {key: cnpg.io/cluster, operator: Exists}
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - {key: cnpg.io/cluster, operator: Exists}
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cnpg-system
    - from:
        - podSelector:
            matchLabels:
              safety.io/db-client: "true"
      ports:
        - protocol: TCP
          port: 5432
---
# Routing is called only by the API.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: valhalla
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: valhalla
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: safety-api
      ports:
        - protocol: TCP
          port: 8002
