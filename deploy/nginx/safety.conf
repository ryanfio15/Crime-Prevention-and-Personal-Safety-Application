# nginx front end for the Phase 1 prototype (see docs/LINUX-MIGRATION.md S6/S7).
#
# Install:
#   cp deploy/nginx/safety.conf /etc/nginx/sites-available/safety
#   ln -s /etc/nginx/sites-available/safety /etc/nginx/sites-enabled/safety
#   rm -f /etc/nginx/sites-enabled/default        # else it wins on port 80
#   # replace SERVER_NAME_PLACEHOLDER below with the DDNS hostname
#   nginx -t && systemctl reload nginx
#   certbot --nginx -d <ddns-host>                # adds TLS + the 80->443 redirect
#
# The shared-memory zones below are http-context directives, so this file has to
# be included from inside `http {}` -- both sites-enabled/ and conf.d/ are.

# ---------------------------------------------------------------------------
# Rate limiting (S7)
#
# The app has no auth, so the only thing standing between a stranger and a
# repeated full-city GeoJSON build is this. Two zones because the endpoints are
# not equally expensive:
#
#   safety_cells  GET /api/v1/cells -- the whole city's hexagons in one
#                 document, and per S6 the bulk of the bytes on the wire. The
#                 frontend only refetches it on a window/category/resolution
#                 change (web/app.js:693-707) and on first load; it sends no
#                 bbox, so panning and zooming cost nothing. A person working
#                 the dropdowns cannot sustain 2r/s, and burst=10 absorbs
#                 someone clicking through every category in one go.
#
#   safety_api    everything else -- /version (polled once a minute per open
#                 tab, web/app.js:757), /cells/{h3} and /cells/ring (fired as a
#                 pair on each hexagon click, web/app.js:273-274), /cities,
#                 /summary, /quality. All cheap and cached in-process, so the
#                 limit is loose enough to be invisible: a page load is ~5
#                 requests and burst=20 swallows it.
#
# nginx picks `location = /api/v1/cells` for the exact path and the `/api/v1/`
# prefix for everything else, so /cells/ring and /cells/lookup correctly land in
# the loose zone rather than the tight one.
#
# 10m of zone state tracks roughly 160k distinct client addresses -- far more
# than this will ever see. `nodelay` serves the burst immediately instead of
# queueing it, which is what keeps the map feeling instant; excess gets 429
# rather than nginx's default 503, since the client is the one being throttled.
# ---------------------------------------------------------------------------

limit_req_zone  $binary_remote_addr  zone=safety_cells:10m  rate=2r/s;
limit_req_zone  $binary_remote_addr  zone=safety_api:10m    rate=10r/s;
limit_conn_zone $binary_remote_addr  zone=safety_conn:10m;

limit_req_status  429;
limit_conn_status 429;

# Log throttling at `warn` so a tripped limit is visible in the error log
# without turning on debug logging.
limit_req_log_level warn;

# ---------------------------------------------------------------------------
# Compression (S6). The cells document is JSON of mostly repeated hex geometry
# and compresses hard. text/html is always gzipped by nginx and must not be
# listed here.
# ---------------------------------------------------------------------------

gzip              on;
gzip_types        application/json application/geo+json application/javascript
                  text/css text/plain image/svg+xml;
gzip_min_length   1024;
gzip_proxied      any;
gzip_vary         on;
gzip_comp_level   5;

upstream safety_api {
    server 127.0.0.1:8000;
    # Reuse upstream connections; the map fires several requests per
    # interaction and a fresh handshake each time is pure latency.
    keepalive 16;
}

server {
    listen      80;
    listen      [::]:80;
    server_name SERVER_NAME_PLACEHOLDER;

    # certbot --nginx edits this block in place -- it adds `listen 443 ssl`,
    # the certificate paths, and a separate server block that redirects :80.
    # Everything below survives that rewrite, so run certbot after this file is
    # in place rather than before.

    access_log /var/log/nginx/safety.access.log;
    error_log  /var/log/nginx/safety.error.log;

    # Nothing in this app accepts an upload; every endpoint is a GET.
    client_max_body_size 1m;

    # Caps concurrent sockets per address. Complements the request-rate limits:
    # 20 slow-drip connections cost nothing in requests-per-second but still tie
    # up the uvicorn worker's pool.
    limit_conn safety_conn 20;

    # Inherited by every location below. uvicorn runs with --proxy-headers
    # --forwarded-allow-ips=127.0.0.1 (S5), so it trusts these from here only.
    proxy_http_version 1.1;
    proxy_set_header   Connection        "";
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;

    # The expensive one. Exact match, so only the layer document lands here.
    location = /api/v1/cells {
        limit_req zone=safety_cells burst=10 nodelay;
        proxy_pass http://safety_api;
    }

    location /api/v1/ {
        limit_req zone=safety_api burst=20 nodelay;
        proxy_pass http://safety_api;
    }

    # Static frontend, plus /docs when ENABLE_DOCS is on. FastAPI serves the
    # web/ directory from the same process at / (safety/api/main.py), so one
    # block covers the whole app.
    location / {
        proxy_pass http://safety_api;
    }
}
