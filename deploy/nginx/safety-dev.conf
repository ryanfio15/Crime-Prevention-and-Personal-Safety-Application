# nginx site for the dev instance: the `testing` branch at ryanfioserverdev.ddns.net.
#
# Same shape as the prod site (/etc/nginx/sites-available/safety), pointed at
# the dev uvicorn on 127.0.0.1:8001. Its rate-limit zones are separate from
# prod's so load-testing dev never throttles a real visitor.
#
# Install HTTP-only, then let certbot add TLS and the redirect:
#   cp deploy/nginx/safety-dev.conf /etc/nginx/sites-available/safety-dev
#   ln -s /etc/nginx/sites-available/safety-dev /etc/nginx/sites-enabled/safety-dev
#   nginx -t && systemctl reload nginx
#   certbot --nginx -d ryanfioserverdev.ddns.net --redirect

limit_req_zone  $binary_remote_addr  zone=safety_dev_cells:10m  rate=2r/s;
limit_req_zone  $binary_remote_addr  zone=safety_dev_api:10m    rate=10r/s;
limit_conn_zone $binary_remote_addr  zone=safety_dev_conn:10m;

upstream safety_dev_api {
    server 127.0.0.1:8001;
    keepalive 16;
}

server {
    server_name ryanfioserverdev.ddns.net;

    access_log /var/log/nginx/safety-dev.access.log;
    error_log  /var/log/nginx/safety-dev.error.log;

    client_max_body_size 1m;
    limit_conn safety_dev_conn 20;

    gzip              on;
    gzip_types        application/json application/geo+json application/javascript
                      text/css text/plain image/svg+xml;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_vary         on;
    gzip_comp_level   5;

    proxy_http_version 1.1;
    proxy_set_header   Connection        "";
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;

    location = /api/v1/cells {
        limit_req zone=safety_dev_cells burst=10 nodelay;
        proxy_pass http://safety_dev_api;
    }
    location /api/v1/ {
        limit_req zone=safety_dev_api burst=20 nodelay;
        proxy_pass http://safety_dev_api;
    }
    location / {
        proxy_pass http://safety_dev_api;
    }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/ryanfioserverdev.ddns.net/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/ryanfioserverdev.ddns.net/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}


server {
    if ($host = ryanfioserverdev.ddns.net) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen      80;
    listen      [::]:80;
    server_name ryanfioserverdev.ddns.net;
    return 404; # managed by Certbot


}