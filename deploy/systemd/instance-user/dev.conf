# N1: dev runs as its own OS user, so code deployed to dev cannot read prod's
# .env, data or process environment. Installed by deploy/os-isolate.sh as
# /etc/systemd/system/safety-{api,etl,etl-hourly,ops}@dev.service.d/10-instance-user.conf
# (never by install-deployer.sh, whose globs do not match this directory).
[Service]
User=safety-dev
Group=safety-dev
