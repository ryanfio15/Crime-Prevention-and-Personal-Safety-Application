<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Replaced with the city under the map once one is served. -->
<title>Reported-incident risk</title>
<link rel="preconnect" href="https://basemaps.cartocdn.com">
<!-- Third-party assets are pinned to an exact version AND to its hash
     (subresource integrity): if unpkg ever served different bytes for these
     URLs, the browser refuses them instead of running them. When bumping a
     version, recompute each hash and update both together:
       curl -sSfL <url> | openssl dgst -sha384 -binary | openssl base64 -A
     crossorigin="anonymous" is required for SRI on a cross-origin fetch; unpkg
     answers with access-control-allow-origin: *. Same-origin files (styles.css,
     html.js, hours.js, progress.js, app.js) need no integrity attribute. -->
<link href="https://unpkg.com/maplibre-gl@5.9.0/dist/maplibre-gl.css" rel="stylesheet"
      integrity="sha384-gNYNsUmuZqDYiT3gbirWTV5K7rt71RoveS/yXAaU09d4ZUmeDVTD3XoqB6uJAIFR"
      crossorigin="anonymous">
<link href="styles.css" rel="stylesheet">
</head>
<body>

<main class="layout">
  <section class="map-pane">
    <div id="map" role="application" aria-label="Map of every covered city, hexagonal cells shaded by relative risk"></div>

    <!-- One row of controls floating on the map: the address search, Show
         tiles and the violent / non-violent toggle. Nothing chooses the data:
         every city is on the map, over the last year, coloured for the hour and
         day it is now in each city. -->
    <div class="map-controls">
      <div class="map-controls-row">
        <!-- Moves the map to a city (switchCity); every city stays drawn. It
             follows the map, so panning to another city updates it
             (updateFocus). Hidden until two or more cities are served. -->
        <label class="field map-control" id="f-city-field" hidden>
          <span class="field-label">City</span>
          <select id="f-city"></select>
        </label>

        <!-- Address search in the city on screen. A match drops a pin and opens
             its cell's popup; Directions then routes to it. Shown once
             /directions/status answers (hidden while the server has directions
             and address search switched off). -->
        <div class="map-control map-search" id="search-field" role="search" hidden>
          <label class="field-label" for="search-input">Find an address</label>
          <div class="combo">
            <input type="text" id="search-input" class="dir-input" role="combobox"
                   aria-autocomplete="list" aria-expanded="false" aria-controls="search-list"
                   placeholder="Address, place or lat, lng" spellcheck="false" autocomplete="off">
            <ul class="combo-list" id="search-list" role="listbox" aria-label="Address suggestions" hidden></ul>
          </div>
          <p class="map-search-status" id="search-status" role="status" aria-live="polite"></p>
          <div class="map-search-actions" id="search-actions" hidden>
            <button type="button" class="btn" id="btn-directions" aria-expanded="false"
                    aria-controls="dir-panel">Directions</button>
            <button type="button" class="search-clear" id="search-clear">Clear</button>
          </div>
        </div>

        <!-- Off makes the cells invisible, not absent: they still answer a
             click with their popup. The track toggle goes with the colour. -->
        <div class="field map-control" id="f-tiles-field">
          <span class="field-label" id="f-tiles-label">Show tiles</span>
          <div class="tabs" role="radiogroup" aria-labelledby="f-tiles-label" id="f-tiles">
            <button type="button" class="tab" role="radio" data-tiles="on"
                    aria-checked="true">On</button>
            <button type="button" class="tab" role="radio" data-tiles="off"
                    aria-checked="false">Off</button>
          </div>
        </div>

        <!-- No visible heading, so the tablist names itself. -->
        <div class="map-control" id="f-track-field">
          <div class="tabs" role="tablist" aria-label="Offences ranked" id="f-track">
            <button type="button" class="tab" role="tab" data-track="violent"
                    aria-selected="true">Violent</button>
            <button type="button" class="tab" role="tab" data-track="non_violent"
                    aria-selected="false">Non-violent</button>
          </div>
        </div>
      </div>

      <!-- Directions to the searched address, from the visitor's location or
           a second address. -->
      <section class="map-control dir-panel" id="dir-panel" aria-labelledby="dir-title" hidden>
        <div class="dir-panel-head">
          <h2 id="dir-title">Directions</h2>
          <button type="button" class="dir-close" id="dir-close" aria-label="Close directions">&times;</button>
        </div>

        <div class="dir-row">
          <span class="field-label">To</span>
          <div class="dir-to-label" id="dir-to-label">&mdash;</div>
        </div>

        <div class="dir-row">
          <label class="field-label" for="dir-from">From</label>
          <div class="combo">
            <input type="text" id="dir-from" class="dir-input" role="combobox"
                   aria-autocomplete="list" aria-expanded="false" aria-controls="dir-from-list"
                   placeholder="Type a start address" spellcheck="false" autocomplete="off">
            <ul class="combo-list" id="dir-from-list" role="listbox" aria-label="Start suggestions" hidden></ul>
          </div>
          <div class="dir-from-actions">
            <span>or</span>
            <button type="button" class="btn" id="dir-from-here">Use my location</button>
          </div>
        </div>

        <div class="tabs dir-modes" role="tablist" aria-label="Travel mode" id="dir-modes">
          <button type="button" class="tab" role="tab" data-mode="drive" aria-selected="false">Drive</button>
          <button type="button" class="tab" role="tab" data-mode="walk" aria-selected="true">Walk</button>
          <button type="button" class="tab" role="tab" data-mode="bike" aria-selected="false">Bike</button>
          <button type="button" class="tab" role="tab" data-mode="transit" aria-selected="false">Transit</button>
        </div>

        <p class="dir-status" id="dir-status" role="status" aria-live="polite"></p>

        <div class="dir-results" id="dir-results" hidden>
          <p class="dir-track" id="dir-track"></p>
          <ol class="route-cards" id="dir-cards"></ol>
          <!-- Follows the selected card, live, on the visitor's location. -->
          <button type="button" class="btn btn-primary dir-start" id="dir-start">Start</button>
          <p class="dir-why" id="dir-why"></p>
          <details class="dir-steps-block">
            <summary id="dir-steps-title">Steps</summary>
            <ol class="dir-steps" id="dir-steps"></ol>
          </details>
          <ul class="dir-caveats" id="dir-caveats"></ul>
        </div>

        <!-- Turn-by-turn: while it runs, everything else in the panel is hidden
             (.is-navigating) and this list of the steps still ahead is all of
             it. Steps drop off as they are passed. -->
        <div class="dir-nav" id="dir-nav" hidden>
          <div class="nav-head">
            <p class="nav-summary"><strong id="nav-left"></strong> <span id="nav-eta"></span></p>
            <button type="button" class="btn" id="nav-end">End</button>
          </div>
          <p class="nav-note" id="nav-note" role="status" aria-live="polite"></p>
          <div class="nav-actions">
            <button type="button" class="btn" id="nav-reroute" hidden>Reroute from here</button>
            <button type="button" class="btn" id="nav-recenter" hidden>Recenter</button>
          </div>
          <p class="nav-on" id="nav-on"></p>
          <ol class="nav-steps" id="nav-steps"></ol>
        </div>

        <p class="dir-attribution" id="dir-attribution"></p>
      </section>
    </div>

    <!-- Which way the nearby cells get quieter, read from the layer on screen
         around the visitor's location (or the map centre until they share it).
         The rose turns with the map, so N always points at real north. -->
    <div class="compass" id="compass" role="group" aria-labelledby="compass-title" hidden>
      <div class="compass-title" id="compass-title">Lower-crime direction</div>
      <div class="compass-dial" id="compass-dial" aria-hidden="true">
        <div class="compass-rose" id="compass-rose">
          <svg viewBox="-50 -50 100 100" class="compass-wedges" id="compass-wedges"></svg>
          <span class="compass-cardinal" style="--a:0deg">N</span>
          <span class="compass-cardinal" style="--a:90deg">E</span>
          <span class="compass-cardinal" style="--a:180deg">S</span>
          <span class="compass-cardinal" style="--a:270deg">W</span>
          <div class="compass-needle" id="compass-needle"></div>
        </div>
      </div>
      <div class="compass-readout" id="compass-readout" aria-live="polite">&mdash;</div>
      <div class="compass-foot" id="compass-foot"></div>
    </div>

    <!-- Where "Use my location" put the visitor, when it is not a cell on this
         map: in no served city, or just past the edge of one. -->
    <div class="locate-note" id="locate-note" role="status" aria-live="polite" hidden>
      <span id="locate-note-text"></span>
      <button type="button" class="btn" id="locate-note-go" hidden></button>
      <button type="button" class="locate-note-close" id="locate-note-close"
              aria-label="Dismiss">&times;</button>
    </div>

    <!-- A live region, so a load error that stays on screen is announced. -->
    <div class="loading" id="loading" role="status" aria-live="polite" hidden>Loading&hellip;</div>

    <!-- While a city's first load (the backfill) runs on the live site: how far
         it has got and roughly how much longer it will take
         (GET /api/v1/progress, web/progress.js). Cities appear as they finish. -->
    <div class="load-progress" id="load-progress" hidden>
      <div class="lp-text" id="lp-text" role="status" aria-live="polite"></div>
      <div class="lp-bar" id="lp-bar" role="progressbar" aria-labelledby="lp-text"
           aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><i id="lp-fill"></i></div>
      <div class="lp-detail" id="lp-detail"></div>
    </div>
  </section>

</main>

<script src="https://unpkg.com/maplibre-gl@5.9.0/dist/maplibre-gl.js"
        integrity="sha384-81ppUWZZO+pveTPk4qU9cZuScEFULHfuOMHVJHFZ7xVBlWQTG1zsPrVIMGAl1WMb"
        crossorigin="anonymous"></script>
<script src="https://unpkg.com/h3-js@4.2.1/dist/h3-js.umd.js"
        integrity="sha384-ViAXEmpUtfR6LTFA4VPFElyF4q6ysOu7yi4fs2v5udUWy6l162CdHpDx1SyS870v"
        crossorigin="anonymous"></script>
<script src="html.js"></script>
<script src="hours.js"></script>
<script src="progress.js"></script>
<script src="directions.js"></script>
<script src="app.js"></script>
<script src="sw-register.js"></script>
</body>
</html>
