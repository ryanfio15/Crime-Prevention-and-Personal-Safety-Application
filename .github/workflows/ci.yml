# The test gate. Runs the same checks a deploy depends on: the migrations apply
# to an empty PostGIS, the suite passes, and the app actually serves.
#
# This file was trimmed when the repository was pruned to the container deploy
# (CLAUDE.md "Git"). What went, and why:
#   - the byte-compile of deploy/railway, and the bash -n / shellcheck sweeps
#     over deploy/{,lib/,k8s/,railway/,git-hooks/} -- those scripts are gone, and
#     a glob that matches nothing fails the step.
#   - the superuser/owner role dance (deploy/db/transfer-ownership.sql, the
#     base-schema-from-main check, the P2 superuser-migration self-test). Those
#     mirrored the systemd host, where migrations ran as a non-superuser owner
#     role. The container deploy connects as one role, POSTGRES_USER, so there is
#     no second role for CI to model.
#   - the previous-commit-on-the-migrated-schema check, which existed because the
#     old deployer could roll back to the previous release in place.
#
# The job id and name stay `ci`: branch protection refers to them.
name: ci

on:
  push:
    branches: [main, testing, "remediation/**"]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    # The same image docker-compose.yml runs, so migrations are exercised
    # against the PostGIS they will meet in production.
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_USER: safety
          POSTGRES_PASSWORD: safety_ci_pw
          POSTGRES_DB: safety
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U safety -d safety"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      # safety/config.py defaults to 55432, the port docker-compose.yml
      # publishes locally; the service container is on the standard one.
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      POSTGRES_USER: safety
      POSTGRES_PASSWORD: safety_ci_pw
      POSTGRES_DB: safety
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Byte-compile
        run: python -m compileall -q safety
      # Importing the entry points catches a missing dependency or a broken
      # module-level statement that compileall cannot see.
      - name: Import entry points
        run: python -c "import safety.api.main, safety.migrate, safety.etl.run, safety.bootstrap, safety.joblock, safety.schemawait, safety.shards"
      - name: Unit tests (no database)
        run: python -m pytest -q -m "not db"
      # The shell expands the glob: Node's `node --test <dir>` treats a
      # directory argument as a module path, not a folder to search.
      - name: JS unit tests
        run: |
          node --check web/app.js
          node --check web/html.js
          node --check web/hours.js
          node --check web/directions.js
          node --check web/progress.js
          node --test tests/js/*.test.mjs
      # Vendored libraries have to be the exact published builds, byte for byte,
      # and have to be present -- the page has no CDN to fall back to now
      # (web/index.html, CLAUDE.md 2.4).
      - name: Vendored libraries are intact
        run: |
          check() {
            got=$(openssl dgst -sha384 -binary "$1" | openssl base64 -A)
            [ "sha384-$got" = "$2" ] || { echo "::error title=Vendored asset::$1 is sha384-$got, expected $2"; exit 1; }
            echo "ok $1"
          }
          check web/vendor/maplibre-gl.css sha384-gNYNsUmuZqDYiT3gbirWTV5K7rt71RoveS/yXAaU09d4ZUmeDVTD3XoqB6uJAIFR
          check web/vendor/maplibre-gl.js  sha384-81ppUWZZO+pveTPk4qU9cZuScEFULHfuOMHVJHFZ7xVBlWQTG1zsPrVIMGAl1WMb
          check web/vendor/h3-js.umd.js    sha384-ViAXEmpUtfR6LTFA4VPFElyF4q6ysOu7yi4fs2v5udUWy6l162CdHpDx1SyS870v
          grep -q 'unpkg.com' web/index.html && { echo "::error::index.html still loads from unpkg"; exit 1; } || true
      - name: Migrate CLI parses
        run: python -m safety.migrate --help
      # One file per bash -n: given several, it parses the first and treats the
      # rest as that script's arguments.
      - name: Deploy scripts parse
        run: for f in deploy/lib/smoke.sh deploy/valhalla/*.sh; do bash -n "$f"; done
      - name: Shellcheck deploy scripts
        run: shellcheck deploy/lib/smoke.sh deploy/valhalla/*.sh
      - name: Migrate
        run: |
          out=$(python -m safety.migrate)
          printf '%s\n' "$out"
          applied=$(printf '%s\n' "$out" | sed -n 's/^Applied [0-9]* migration(s): //p')
          echo "::notice title=Applied::${applied:-none}"
      # Twice: every deploy re-runs migrate against a database that is already
      # up to date, so this pass is the one that matches production.
      - name: Migrate again (idempotency)
        run: python -m safety.migrate
      # The host's silver partitions exist before any ETL runs.
      #
      # `with`, not connect().__enter__(): connect() is a generator context
      # manager, and once the unreferenced manager is collected its finally
      # closes the connection under you.
      - name: Create partitions
        run: |
          python - <<'PY'
          from safety.db import connect, ensure_partitions
          with connect() as conn:
              ensure_partitions(conn, "phl", [2024, 2025])
              conn.commit()
          PY
      # Failures are also raised as annotations, which show on the run page
      # (and through the check-runs API) without access to the raw logs.
      #
      # Not in parallel with anything that takes the ETL advisory lock:
      # tests/test_joblock.py takes it for real (CLAUDE.md 4.1).
      - name: Database tests
        env:
          SAFETY_TEST_DB: "1"
        run: |
          set -o pipefail
          python -m pytest -q -m db -rfE --tb=line 2>&1 | tee "$RUNNER_TEMP/db-tests.log" || {
            grep -E '^(FAILED|ERROR) |^/.*:[0-9]+: |^E ' "$RUNNER_TEMP/db-tests.log" | head -10 |
              while IFS= read -r line; do echo "::error title=Database tests::$line"; done
            exit 1
          }
      # Empty manifests, but it runs the query with every filter combination.
      - name: Run log query
        run: |
          python -m safety.etl.run log
          python -m safety.etl.run log --since 7d --city phl --failed
      # The same deploy/lib/smoke.sh DEPLOY.md section 6 runs on the server, so a
      # commit that would fail there is red here first. "-": nothing is deployed,
      # so there is no commit to match.
      - name: Start the app and smoke it
        run: |
          python -m uvicorn safety.api.main:app --host 127.0.0.1 --port 8000 \
            > "$RUNNER_TEMP/uvicorn.log" 2>&1 &
          deploy/lib/smoke.sh 8000 - || { cat "$RUNNER_TEMP/uvicorn.log"; exit 1; }
